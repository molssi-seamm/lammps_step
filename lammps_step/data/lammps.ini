# =============================================================================
# Configuration options for how to run LAMMPS
# =============================================================================
#
# This file controls how SEAMM launches LAMMPS. It has sections for each
# executor type: [local] for running directly on the machine, [docker] for
# Docker containers. The executor reads this file, substitutes {variables}
# in the command templates, and runs the result via subprocess.
#
# Available variables for substitution (from the computational environment):
#   {NTASKS}          - Number of MPI tasks (auto-calculated from atom count)
#   {NGPUS}           - Number of GPUs allocated (PyTorch runs only)
#   {MEM_PER_NODE}    - Available memory per node (bytes)
#   {MEM_PER_CPU}     - Available memory per CPU (bytes)
#
# Under SLURM, additional variables are available:
#   {NNODES}, {NTASKS_PER_NODE}, {NODELIST}, {JOB_ID}, etc.
#
# Variables from this config file can also be referenced, including nested
# substitution. For example, if you define:
#   my_path = /opt/lammps
#   code = mpirun -np {NTASKS} {my_path}/lmp
#
# The environment variable SEAMM_GPUS is set to the comma-separated list of
# GPU IDs (e.g., "0,1") and SEAMM_FF is set to the path of the PyTorch model
# file for MLFF runs.
#
# =============================================================================
# EXECUTION MODES
# =============================================================================
#
# There are three main scenarios for running LAMMPS:
#
# 1. CPU-only classical forcefields (OPLS-AA, AMBER, etc.)
#    Uses: code, cmd-args
#    Example: mpirun -np 32 lmp -in input.dat
#
# 2. GPU with native Kokkos (ML-IAP, pair_style mliap, etc.)
#    Uses: gpu-code, gpu-cmd-args
#    Example: mpirun -np 2 gpu_bind.sh lmp -k on g 1 -sf kk ... -in input.dat
#
# 3. GPU with MDI engine (MACE, NequIP, etc. via mace_mdi.py)
#    Uses: gpu-code (no gpu-cmd-args needed)
#    Example: mpirun -np 1 mdi_bind.sh python mace_mdi.py -mdi "..."
#             : -np 1 mdi_bind.sh lmp -mdi "..." -in input.dat
#
# The code automatically selects between cpu (code + cmd-args) and gpu
# (gpu-code + gpu-cmd-args) based on whether GPUs are allocated. The
# "-in input.dat" is always appended automatically, so do NOT include it
# in gpu-code or code.
#
# =============================================================================

[local]
# -------------------------------------------------------------------------
# Installation type: conda | modules | local | docker
# -------------------------------------------------------------------------
# conda:   Run inside a conda environment (default SEAMM setup)
# modules: Use environment modules (typical HPC setup)
# local:   Executables are in PATH or specified with full paths
# docker:  Run inside a Docker container
# -------------------------------------------------------------------------
installation = conda

# -------------------------------------------------------------------------
# CPU command template
# -------------------------------------------------------------------------
# Used for classical forcefield runs (no GPU). The command should include
# the MPI launcher and the LAMMPS executable. "-in input.dat" is appended
# automatically.
#
# Examples:
#   code = mpirun -np {NTASKS} lmp
#   code = srun lmp                              # SLURM-aware MPI
#   code = mpirun -np {NTASKS} -H {NODELIST} lmp # explicit host list

code = mpirun -np {NTASKS} lmp

# -------------------------------------------------------------------------
# Python command template (for run_lammps wrapper scripts)
# -------------------------------------------------------------------------
python = mpirun -np {NTASKS} python

# -------------------------------------------------------------------------
# Optional CPU command-line arguments for LAMMPS
# -------------------------------------------------------------------------
# Appended after the code but before "-in input.dat". Typically used for
# accelerator packages on CPU (e.g., OpenMP or Intel optimizations).
#
# Examples:
#   cmd-args = -sf omp -pk omp {NTASKS}
#   cmd-args = -sf intel

# cmd-args =

# =========================================================================
# GPU CONFIGURATION
# =========================================================================
# When GPUs are detected and a PyTorch forcefield is selected, SEAMM uses
# gpu-code instead of code. There are two main GPU approaches:
#
#   A) Native Kokkos GPU:  LAMMPS compiled with Kokkos+CUDA, using ML-IAP
#      or similar pair_styles that run directly on GPU.
#
#   B) MDI engine:  Standard LAMMPS as a driver communicating with a
#      separate Python process (mace_mdi.py) that runs the ML model on GPU.
#
# Approach B is easier to set up (no Kokkos compilation needed), runs on
# more platforms (including Mac), and supports any model that has an ASE
# calculator. Approach A can be faster for models with native LAMMPS
# support (ML-IAP, PACE).
# =========================================================================

# -------------------------------------------------------------------------
# GPU command template
# -------------------------------------------------------------------------
# Used when GPUs are allocated. "-in input.dat" is appended automatically.
#
# --- Approach A: Kokkos GPU ---
# gpu-code = mpirun -np {NTASKS} --bind-to none gpu_bind.sh lmp
# gpu-cmd-args = -k on g 1 -sf kk -pk kokkos newton on neigh half gpu/aware on
#
# --- Approach B: MDI engine (MACE on GPU) ---
# For standalone machines (mdi_bind.sh handles CPU/GPU pinning):
#
# gpu-code = mpirun --mca mpi_yield_when_idle 1
#     -np 1 ~/SEAMM/bin/mdi_bind.sh
#     python ~/SEAMM/bin/mace_mdi.py -mdi "-role ENGINE -name MACE -method MPI"
#     : -np 1 ~/SEAMM/bin/mdi_bind.sh
#     lmp -mdi "-role DRIVER -name LAMMPS -method MPI"
#
# For HPC with SLURM/PBS (mdi_monitor.sh for GPU monitoring only,
# scheduler handles resource binding):
#
# gpu-code = mpirun
#     -np 1 ~/SEAMM/bin/mdi_monitor.sh
#     python ~/SEAMM/bin/mace_mdi.py -mdi "-role ENGINE -name MACE -method MPI"
#     : -np 1 ~/SEAMM/bin/mdi_monitor.sh
#     lmp -mdi "-role DRIVER -name LAMMPS -method MPI"
#
# NOTE: The gpu-code examples above are shown on multiple lines for
# readability. In the actual config file, either put it all on one line
# or use backslash continuation:
#
# gpu-code = mpirun --mca mpi_yield_when_idle 1 \
#     -np 1 ~/SEAMM/bin/mdi_bind.sh \
#     python ~/SEAMM/bin/mace_mdi.py -mdi "-role ENGINE -name MACE -method MPI" \
#     : -np 1 ~/SEAMM/bin/mdi_bind.sh \
#     lmp -mdi "-role DRIVER -name LAMMPS -method MPI"

# gpu-code =

# -------------------------------------------------------------------------
# GPU command-line arguments for LAMMPS
# -------------------------------------------------------------------------
# Appended after gpu-code. Used with Kokkos to pass accelerator flags.
# Not needed for MDI (leave commented out or empty).
#
# Example for Kokkos:
#   gpu-cmd-args = -k on g 1 -sf kk -pk kokkos newton on neigh half gpu/aware on

# gpu-cmd-args =

# =========================================================================
# ENVIRONMENT MODULES (installation = modules)
# =========================================================================
# When using environment modules on HPC systems, specify which module(s)
# to load. The code selects gpu_modules when GPUs are allocated, otherwise
# modules. The module is loaded before the command is executed.
#
# Examples:
#   modules = LAMMPS/29Aug2024-foss-2024a
#   gpu_modules = LAMMPS/22Jul2025-foss-2024a-kokkos-CUDA-12.6.0

# modules =
# gpu_modules =

# =========================================================================
# CONDA CONFIGURATION (installation = conda)
# =========================================================================
# Full path to the conda executable (auto-detected from CONDA_EXE if not set):
# conda =

# Conda environment name or path:
# conda-environment = seamm-lammps

# =========================================================================
# DOCKER CONFIGURATION (installation = docker)
# =========================================================================
# Container image (use {version} for the plugin version):
# container = ghcr.io/molssi-seamm/seamm-lammps:{version}

# Platform override (useful for Apple Silicon Macs):
platform = linux/amd64


[docker]
# -------------------------------------------------------------------------
# Docker executor settings
# -------------------------------------------------------------------------
code = mpirun -n {NTASKS} lmp
python = python

# container = ghcr.io/molssi-seamm/seamm-lammps:{version}
platform = linux/amd64
