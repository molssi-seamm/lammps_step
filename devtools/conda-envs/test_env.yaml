name: test

channels:
  - conda-forge
  - defaults

dependencies:
  # Base depends
  - python
  - pip

  # SEAMM
  # seamm.Node still uses the bibtexparser 1.x API (loads), but reference-handler
  # does not pin it, so conda is free to bring in 2.x and break every test that
  # creates a node.
  - bibtexparser<2
  - kim-query
  - py-cpuinfo
  - rdkit
  - seamm
  - seamm-ff-util
  - seamm-installer
  - statsmodels
  - tabulate

  # Testing
  - black
  - codecov
  - flake8
  - pytest
  - pytest-cov

  # Documentation
  - pydata-sphinx-theme
  - sphinx-design

  # Pip-only installs
  - pip:
    - gputil
    - model-chemistry-step
    - Pmw
    - pymbar>=4.0
    - seamm-exec
    # Documentation
    - sphinx-copybutton
